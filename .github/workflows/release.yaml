name: release

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC) and provenance attestations
  id-token: write

env:
  HYPHEN_PUBLIC_API_KEY: ${{ secrets.HYPHEN_PUBLIC_API_KEY }}
  HYPHEN_API_KEY: ${{ secrets.HYPHEN_API_KEY }}
  HYPHEN_APPLICATION_ID: ${{ secrets.HYPHEN_APPLICATION_ID }}
  HYPHEN_ORGANIZATION_ID: ${{ secrets.HYPHEN_ORGANIZATION_ID }}
  HYPHEN_LINK_DOMAIN: ${{ secrets.HYPHEN_LINK_DOMAIN }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Socket Firewall
      uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free
        firewall-version: "1.15.4"

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install Dependencies
      run: sfw pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    - name: Testing
      run: pnpm test

    - name: Publish
      # No NPM_TOKEN: pnpm authenticates via OIDC trusted publishing and
      # generates provenance attestations from the OIDC identity.
      # --no-git-checks is required because the release runs from a detached
      # tag checkout rather than a branch.
      run: pnpm publish --provenance --no-git-checks --ignore-scripts
